name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/GrokVoice-test.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: grokvoice-android-test
          path: out/GrokVoice-test.apk

      # A release gives a plain download link that opens straight on the phone.
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Grok Voice Android test build ${{ github.run_number }}
          body: "Side key test build from ${{ github.ref_name }} (${{ github.sha }}). Open this page on the phone and tap GrokVoice-test.apk."
          prerelease: false
          make_latest: true
          files: out/GrokVoice-test.apk
